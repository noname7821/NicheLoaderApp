name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.2.app
    
    - name: Build IPA
      run: |
        xcodebuild \
          -project NicheLoader.xcodeproj \
          -scheme NicheLoader \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
    
    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r ./build/Build/Products/Release-iphoneos/NicheLoader.app Payload/
        zip -r NicheLoader.ipa Payload/
        ls -lh NicheLoader.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: NicheLoader-IPA
        path: NicheLoader.ipa
